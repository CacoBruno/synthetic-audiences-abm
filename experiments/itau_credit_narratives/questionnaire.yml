common_items:
  - id: VAL_01
    construct: Valencia
    question: "Minha reação geral a este conteúdo é:"
    scale_min: 1
    scale_max: 7
    low_anchor: muito negativa
    high_anchor: muito positiva
    direction: positive

  - id: CRE_01
    construct: Credibilidade
    question: O conteúdo me parece preciso.
    scale_min: 1
    scale_max: 7
    low_anchor: discordo totalmente
    high_anchor: concordo totalmente
    direction: positive

  - id: CRE_02
    construct: Credibilidade
    question: O conteúdo me parece autêntico.
    scale_min: 1
    scale_max: 7
    low_anchor: discordo totalmente
    high_anchor: concordo totalmente
    direction: positive

  - id: CRE_03
    construct: Credibilidade
    question: O conteúdo me parece crível.
    scale_min: 1
    scale_max: 7
