themes:
  ia_preco_credito:
    items:
      - id: IA_CAP
        construct: Adequação à capacidade de pagamento
        conditions: [narrative, context_plus_narrative]
        question: A mensagem me faz acreditar que o Itaú usa inteligência artificial para oferecer crédito compatível com o que o cliente consegue pagar.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: IA_WTP
        construct: Exploração por disposição a pagar
        question: Tenho a impressão de que dados pessoais podem ser usados para cobrar a maior taxa que o consumidor aceitaria pagar.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: IA_TRA
        construct: Transparência algorítmica
        question: O conteúdo me deixa confiante de que um consumidor conseguiria entender por que recebeu determinada taxa ou limite de crédito.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: IA_DIS
        construct: Risco de discriminação
        question: Vejo risco de esse uso de tecnologia tratar alguns clientes de forma injusta ou discriminatória.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: IA_ANT
        construct: Prevenção do endividamento
        conditions: [narrative, context_plus_narrative]
        question: A mensagem me faz acreditar que a tecnologia pode ajudar o Itaú a agir antes que a dívida se torne um problema maior.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

    qualitative_by_condition:
      context:
        interpretation_prompt: Em uma frase, explique qual uso ou risco de inteligência artificial no crédito ficou mais saliente no contexto apresentado.
        open_prompt: Explique brevemente como você interpretou o debate sobre uso de dados, taxas e limites de crédito.
        critique_prompt: Qual é sua principal preocupação ou dúvida diante desse contexto?
        residual_concern_prompt: Mesmo após formar sua interpretação principal, qual preocupação permanece mais importante para você?
        motivation_prompt: Explique o principal motivo da sua reação ao contexto, considerando sua situação financeira e o que foi apresentado.
        residual_concern_categories:
          - nenhuma
          - falta_transparencia
          - disposicao_a_pagar
          - discriminacao
          - uso_dados
          - impossibilidade_contestar
          - interesse_comercial
          - exclusao_credito
          - outro
        categories:
          - risco_credito
          - disposicao_a_pagar
          - discriminacao
          - transparencia
          - capacidade_pagamento
          - nao_entendeu

      narrative:
        interpretation_prompt: Em uma frase, explique o que você acha que a inteligência artificial do Itaú faz ao decidir uma oferta, limite ou taxa de crédito.
        open_prompt: Explique brevemente como você interpretou o papel da inteligência artificial nesta mensagem do Itaú.
        critique_prompt: Qual seria sua principal dúvida ou crítica sobre esse uso de inteligência artificial pelo Itaú?
        residual_concern_prompt: Depois de entender a proposta do Itaú, qual preocupação ainda permanece mais importante para você?
        motivation_prompt: Explique por que essa mensagem aumenta, mantém ou reduz sua confiança no uso de inteligência artificial pelo Itaú, considerando seu perfil.
        residual_concern_categories:
          - nenhuma
          - falta_transparencia
          - disposicao_a_pagar
          - discriminacao
          - uso_dados
          - impossibilidade_contestar
          - interesse_comercial
          - exclusao_credito
          - outro
        categories:
          - capacidade_pagamento
          - risco_credito
          - disposicao_a_pagar
          - discriminacao
          - controle_endividamento
          - nao_entendeu

      context_plus_narrative:
        interpretation_prompt: Depois de conhecer o debate e a posição do Itaú, em uma frase explique qual papel você acha que a inteligência artificial do Itaú desempenha na concessão de crédito.
        open_prompt: Explique brevemente se o posicionamento do Itaú muda ou não sua interpretação do risco apresentado no contexto.
        critique_prompt: Depois de ler o contexto e a resposta do Itaú, qual dúvida ou crítica permanece?
        residual_concern_prompt: Depois de conhecer a controvérsia e a resposta do Itaú, qual preocupação residual continua mais importante?
        motivation_prompt: Explique por que a resposta do Itaú foi ou não suficiente para mudar sua percepção inicial, considerando seu perfil.
        residual_concern_categories:
          - nenhuma
          - falta_transparencia
          - disposicao_a_pagar
          - discriminacao
          - uso_dados
          - impossibilidade_contestar
          - interesse_comercial
          - exclusao_credito
          - outro
        categories:
          - capacidade_pagamento
          - risco_credito
          - disposicao_a_pagar
          - discriminacao
          - controle_endividamento
          - nao_entendeu

  fintech_excesso_oferta:
    items:
      - id: FT_RES
        construct: Crédito responsável
        conditions: [narrative, context_plus_narrative]
        question: A mensagem do Itaú transmite responsabilidade na concessão de crédito.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: FT_LON
        construct: Orientação de longo prazo
        conditions: [narrative, context_plus_narrative]
        question: A mensagem mostra que o Itaú está preocupado com a situação financeira do cliente no longo prazo.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: FT_PRO
        construct: Proteção do cliente
        conditions: [narrative, context_plus_narrative]
        question: A proposta de respeitar a capacidade de pagamento me faz sentir mais protegido como cliente.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: FT_EXC
        construct: Risco de exclusão
        conditions: [narrative, context_plus_narrative]
        question: Essa proposta pode servir como justificativa para negar crédito a quem mais precisa.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: FT_PAT
        construct: Paternalismo percebido
        conditions: [narrative, context_plus_narrative]
        question: A mensagem passa a impressão de que o banco acredita saber melhor do que o cliente quanto ele deve gastar ou tomar emprestado.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: FT_ATQ
        construct: Ataque percebido a fintechs
        conditions: [narrative, context_plus_narrative]
        question: A mensagem parece uma tentativa de criticar bancos digitais para valorizar bancos tradicionais.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: FT_LEG
        construct: Legitimidade
        conditions: [narrative, context_plus_narrative]
        question: Considero legítimo um grande banco defender esse posicionamento sobre concessão responsável de crédito.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: FT_CTX_INAD
        construct: Risco percebido do crédito digital
        conditions: [context]
        question: O contexto apresentado me faz perceber que a expansão do crédito digital pode aumentar o risco de endividamento ou inadimplência.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

      - id: FT_CTX_INC
        construct: Inclusão financeira percebida
        conditions: [context]
        question: O contexto apresentado também mostra que o crédito digital pode ampliar o acesso de pessoas antes pouco atendidas pelo sistema financeiro.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: positive

      - id: FT_CTX_CAUS
        construct: Causalidade percebida
        conditions: [context]
        question: O conteúdo apresentado é suficiente para concluir que bancos digitais causaram o aumento do endividamento das famílias.
        scale_min: 1
        scale_max: 7
        low_anchor: discordo totalmente
        high_anchor: concordo totalmente
        direction: negative

    qualitative_by_condition:
      context:
        interpretation_prompt: Em uma frase, diga qual problema ou oportunidade do crédito digital aparece como principal no contexto apresentado.
        open_prompt: Explique brevemente como você interpreta a relação entre expansão do crédito digital, inclusão financeira e inadimplência.
        critique_prompt: Qual informação adicional você precisaria para formar uma opinião mais segura sobre esse contexto?
        residual_concern_prompt: Qual preocupação permanece mais importante depois de considerar inclusão financeira e risco de inadimplência?
        motivation_prompt: Explique o principal motivo da sua reação ao contexto sobre crédito digital, considerando sua situação financeira.
        residual_concern_categories:
          - nenhuma
          - exclusao
          - paternalismo
          - ataque_fintechs
          - juros_altos
          - promessa_sem_evidencia
          - falta_transparencia
          - causalidade_incerta
          - outro
        categories:
          - inclusao_financeira
          - excesso_oferta
          - inadimplencia
          - causalidade_incerta
          - credito_responsavel
          - outro

      narrative:
        interpretation_prompt: Em uma frase, diga qual ideia principal você entende que o Itaú está defendendo sobre concessão de crédito.
        open_prompt: Explique brevemente como você interpretou a posição do Itaú sobre crédito responsável.
        critique_prompt: Qual é a principal crítica que você faria a essa posição do Itaú?
        residual_concern_prompt: Depois de entender a proposta de crédito responsável do Itaú, qual preocupação ainda permanece mais importante?
        motivation_prompt: Explique por que essa posição do Itaú aumenta, mantém ou reduz sua confiança no banco, considerando seu perfil.
        residual_concern_categories:
          - nenhuma
          - exclusao
          - paternalismo
          - ataque_fintechs
          - juros_altos
          - promessa_sem_evidencia
          - falta_transparencia
          - causalidade_incerta
          - outro
        categories:
          - credito_responsavel
          - exclusao
          - paternalismo
          - ataque_fintechs
          - juros_altos
          - outro

      context_plus_narrative:
        interpretation_prompt: Depois de conhecer o contexto do crédito digital e a posição do Itaú, em uma frase diga qual ideia principal você entende que o banco está defendendo.
        open_prompt: Explique brevemente se o contexto sobre bancos digitais muda ou não sua leitura da narrativa do Itaú.
        critique_prompt: Depois de ler o contexto e a resposta do Itaú, qual é a principal crítica que permanece?
        residual_concern_prompt: Depois de conhecer o contexto das fintechs e a resposta do Itaú, qual preocupação residual continua mais importante?
        motivation_prompt: Explique por que o posicionamento do Itaú foi ou não suficiente para mudar sua percepção do problema, considerando seu perfil.
        residual_concern_categories:
          - nenhuma
          - exclusao
          - paternalismo
          - ataque_fintechs
          - juros_altos
          - promessa_sem_evidencia
          - falta_transparencia
          - causalidade_incerta
          - outro
        categories:
          - credito_responsavel
          - exclusao
          - paternalismo
          - ataque_fintechs
          - juros_altos
          - outro
