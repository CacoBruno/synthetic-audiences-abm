  fintech_excesso_oferta:
    title: Fintechs e excesso de oferta
    sources:
      - https://www.jb.com.br/economia/2026/09/1060945-boom-do-credito-digital-no-brasil-aumenta-endividamento-das-familias.html
    stimuli:
      - id: fintech_contexto
        theme: fintech_excesso_oferta
        condition: context
        title: Contexto crítico — expansão do crédito digital
        content: |
          Um estudo da Equifax Boa Vista reportou forte crescimento da inadimplência no cartão entre clientes de bancos digitais entre 2021 e 2025, enquanto o indicador ficou mais estável entre bancos tradicionais.
          O estudo também mostrou que uma parcela relevante dos cartões emitidos por bancos digitais foi o primeiro cartão do cliente.
          Especialistas discutem se a expansão do crédito digital ampliou inclusão financeira ao mesmo tempo em que facilitou acesso rápido a limites e empréstimos para pessoas com pouco histórico de crédito.
          Esses dados mostram associação entre expansão do crédito digital e maior inadimplência, mas não demonstram sozinhos que bancos digitais sejam a causa do endividamento das famílias.

      - id: fintech_narrativa
        theme: fintech_excesso_oferta
        condition: narrative
        title: Narrativa Itaú — crédito como relação de longo prazo
        content: |
          No Itaú, conceder crédito é o começo de uma relação de longo prazo, e não uma transação. Por isso, oferecemos um crédito que acompanha a vida de cada cliente, que cresce junto com ele, respeita sua capacidade de pagamento e vem com orientação para ser bem usado. É assim que o crédito cumpre seu papel de realizar planos e movimentar a economia, sem se tornar um peso para as famílias.

      - id: fintech_contexto_narrativa
        theme: fintech_excesso_oferta
        condition: context_plus_narrative
        title: Contexto crítico + narrativa Itaú
        content: |
