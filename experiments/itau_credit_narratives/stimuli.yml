themes:
  ia_preco_credito:
    title: IA e o preço do crédito
    sources:
      - https://www.hklaw.com/en/insights/publications/2026/04/surveillance-pricing-ai-pricing-tools
      - https://www.correiobraziliense.com.br/aqui/2026/09/01/como-a-inteligencia-artificial-define-a-taxa-de-juros-do-seu-cartao/
    stimuli:
      - id: ia_contexto
        theme: ia_preco_credito
        condition: context
        title: Contexto crítico — IA e personalização do preço
        content: |
          O uso de inteligência artificial para definir preços e condições individualizadas vem sendo debatido por reguladores e legisladores.
          Uma distinção importante é entre preços que variam conforme condições de mercado, preços personalizados com base em características e comportamento do consumidor e precificação de crédito baseada em risco de inadimplência.
          No crédito, algoritmos podem usar dados financeiros e comportamentais para estimar risco e definir limite ou taxa. Ao mesmo tempo, existe preocupação de que dados pessoais também possam ser usados de forma pouco transparente, discriminatória ou para estimar quanto cada consumidor estaria disposto a pagar.

      - id: ia_narrativa
        theme: ia_preco_credito
        condition: narrative
        title: Narrativa Itaú — IA a serviço da saúde financeira
        content: |
          No Itaú, a inteligência artificial é usada para conhecer melhor a realidade financeira de cada cliente e oferecer um crédito que ele consiga pagar. É com ela que ampliamos o acesso ao crédito de forma segura e agimos de forma antecipada para ajudar o cliente ao perceber quando uma dívida começa a pesar. Usamos a tecnologia a serviço da saúde financeira das pessoas.

      - id: ia_contexto_narrativa
        theme: ia_preco_credito
        condition: context_plus_narrative
        title: Contexto crítico + narrativa Itaú
        content: |
          CONTEXTO:
          O uso de inteligência artificial para definir preços e condições individualizadas vem sendo debatido por reguladores e legisladores.
          Uma distinção importante é entre preços que variam conforme condições de mercado, preços personalizados com base em características e comportamento do consumidor e precificação de crédito baseada em risco de inadimplência.
          No crédito, algoritmos podem usar dados financeiros e comportamentais para estimar risco e definir limite ou taxa. Ao mesmo tempo, existe preocupação de que dados pessoais também possam ser usados de forma pouco transparente, discriminatória ou para estimar quanto cada consumidor estaria disposto a pagar.

