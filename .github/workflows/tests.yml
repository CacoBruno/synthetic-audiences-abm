name: tests

on:
  push:
    branches:
      - feat/itau-credit-narratives
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test Itaú experiment
        run: |
          python experiments/itau_credit_narratives/build_agents.py --n-per-profile 1
          python experiments/itau_credit_narratives/run_experiment.py --mock --repeats 1
          python experiments/itau_credit_narratives/analyze_results.py
