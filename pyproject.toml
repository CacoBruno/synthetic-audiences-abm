[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-audiences-abm"
version = "0.1.0"
description = "MVP for synthetic audiences using population-weighted agent-based profiles and LLM survey agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Claudio Bruno" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "tabulate>=0.9",
  "openai>=1.40"
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
synthaud = "synthetic_audiences.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
