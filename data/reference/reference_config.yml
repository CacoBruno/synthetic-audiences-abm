project:
  name: Synthetic Audiences ABM
  version: 0.1.0
  source_notes:
    - Os pesos e cruzamentos iniciais foram derivados dos arquivos markdown do projeto.
    - Esta é uma configuração MVP: ajuste pesos e tabelas conforme novas fontes de dados forem incorporadas.

outputs:
  default_profiles_csv: data/output/agents.csv
  default_results_jsonl: data/output/responses.jsonl
  default_summary_csv: data/output/summary.csv

demographic_variables:
  idade: ["16-24 anos", "25-34 anos", "35-49 anos", "50-64 anos", "65 anos ou mais"]
  gênero: ["Feminino", "Masculino", "Outro / não binário", "Prefere não responder"]
  escolaridade: ["Sem instrução", "Ensino fundamental incompleto", "Ensino fundamental completo", "Ensino médio incompleto", "Ensino médio completo", "Ensino técnico / profissionalizante", "Ensino superior incompleto", "Ensino superior completo", "Pós-graduação"]
  situação ocupacional: ["Empregado com carteira assinada", "Empregado sem carteira assinada", "Funcionário público", "Autônomo / conta própria", "MEI", "Empregador / empresário", "Desempregado procurando trabalho", "Aposentado / pensionista", "Estudante", "Dona(o) de casa / trabalho doméstico não remunerado", "Sem ocupação no momento"]
  estado civil: ["Solteiro(a)", "Casado(a)", "União estável", "Divorciado(a)", "Separado(a)", "Viúvo(a)"]
  condição de moradia: ["Imóvel próprio quitado", "Imóvel próprio financiado", "Imóvel alugado", "Imóvel cedido por familiar ou terceiros", "Ocupação / moradia sem pagamento formal"]
  tipo de moradia: ["Casa", "Apartamento", "Casa em condomínio", "Quarto / cômodo / pensão", "Cortiço / habitação coletiva", "Moradia rural", "Outro tipo de moradia"]
  localização: ["Capital", "Região metropolitana", "Interior urbano", "Zona rural"]
  renda familiar mensal: ["Até 1 salário mínimo", "Mais de 1 a 2 salários mínimos", "Mais de 2 a 3 salários mínimos", "Mais de 3 a 5 salários mínimos", "Mais de 5 a 10 salários mínimos", "Mais de 10 a 20 salários mínimos", "Mais de 20 salários mínimos"]
  acesso à internet: ["Tem internet fixa em casa", "Usa principalmente internet móvel", "Usa internet fora de casa", "Não tem acesso regular à internet"]
  tamanho do domicílio: ["1 pessoa", "2-3 pessoas", "4-5 pessoas", "6 pessoas ou mais"]
  telefone: ["Apenas celular", "Celular e telefone fixo", "Apenas telefone fixo", "Não possui telefone"]
  identificação política: ["Esquerda", "Centro-esquerda", "Centro", "Centro-direita", "Direita", "Não se identifica politicamente", "Prefere não responder"]
  ideologia: ["Muito progressista", "Progressista", "Moderado(a)", "Conservador(a)", "Muito conservador(a)", "Prefere não responder"]
  raça/cor: ["Branca", "Preta", "Parda", "Amarela", "Indígena", "Prefere não responder"]

survey_variables:
  geração: ["Geração Bossa Nova", "Geração Ordem e Progresso", "Geração Redemocratização", "Geração.Com"]
  segmento_e_bolhas: ["Conservadores cristãos", "Dependentes do Estado / Classe D e E", "Agro", "Progressistas", "Militantes de esquerda", "Empresários", "Liberais sociais", "Empreendedores individuais", "Extrema direita"]
