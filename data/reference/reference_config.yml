values_dimensions:
  Religiosidade: "Mede o quanto a fé organiza a vida moral e cotidiana. Considerar centralidade de Deus, prática religiosa e tolerância religiosa."
  Família: "Captura família como núcleo de pertencimento, proteção e motivação, incluindo tensão entre família tradicional e novos arranjos."
  Honestidade: "Considera cumprimento de regras, informalidade, jeitinho e julgamento moral contextual."
  Meritocracia: "Expressa crença em esforço individual, merecimento da ajuda, pobreza e apoio/rejeição a políticas redistributivas."
  Ideologia: "Usar identidade política, conservadorismo/progressismo, estatismo econômico e punitivismo."
  Discriminação: "Mede reconhecimento de racismo, machismo, preconceitos e ações afirmativas."
  Sexualidade: "Captura aceitação de diversidade sexual, tolerância privada versus expressão pública e normas de gênero."
  Comportamento social: "Traduz sociabilidade cotidiana, hábitos de mídia, vida dentro/fora de casa e relação com segurança."
  Identidade nacional: "Mede orgulho/vergonha do Brasil, povo brasileiro, natureza, cultura regional e complexo de vira-lata."
  Insegurança: "Captura medo da violência, vulnerabilidade percebida e tradução política do medo."
  Confiança: "Mede confiança interpessoal, família, vizinhos, desconhecidos, instituições e pessoas diferentes."
